name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Display .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore ProMapCargo.sln

      - name: Build
        run: dotnet build ProMapCargo.sln --configuration Release --no-restore
