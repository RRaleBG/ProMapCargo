name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore ProMapCargo.sln --locked-mode || dotnet restore ProMapCargo.sln

      - name: Build
        run: dotnet build ProMapCargo.sln --configuration Release --no-restore /warnaserror

      - name: Test
        run: dotnet test ProMapCargo.sln --configuration Release --no-build --verbosity normal

      - name: Vulnerability audit
        run: dotnet list ProMapCargo.sln package --vulnerable --include-transitive

      - name: Format verification
        run: dotnet format ProMapCargo.sln --verify-no-changes --no-restore
