services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: promap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: promapcargo
      POSTGRES_USER: promap
      POSTGRES_PASSWORD: promap_dev_change_me
    ports:
      - "5432:5432"
    volumes:
      - promap_pgdata:/var/lib/postgresql/data
      - ./osm:/osm
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U promap -d promapcargo"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  osrm:
    image: osrm/osrm-backend:latest
    container_name: promap-osrm
    restart: unless-stopped
    command:
      [
        "osrm-routed",
        "--algorithm",
        "mld",
        "/data/serbia-latest.osrm"
      ]
    ports:
      - "5001:5000"
    volumes:
      - ./osm:/data:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promap-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=promapcargo;Username=promap;Password=promap_dev_change_me

      Routing__OsrmBaseUrl: http://osrm:5000
      Routing__OsrmFallbackBaseUrl: https://router.project-osrm.org

      TomTom__ApiKey: ${TOMTOM_API_KEY}
      TomTom__TrafficStyle: dark

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      osrm:
        condition: service_started

volumes:
  promap_pgdata: